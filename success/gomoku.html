<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 人机对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .status {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 10px;
            background: #f0f0f0;
            color: #333;
            font-weight: bold;
        }

        .status.player-turn {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.ai-turn {
            background: #fff3e0;
            color: #f57c00;
        }

        .status.win {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.lose {
            background: #ffebee;
            color: #d32f2f;
        }

        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #board {
            border: 3px solid #8b4513;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-undo {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-undo:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .difficulty {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .difficulty label {
            font-weight: bold;
            color: #333;
        }

        .difficulty select {
            padding: 8px 15px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        .difficulty select:focus {
            border-color: #667eea;
        }

        .score {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .score-item {
            padding: 10px 20px;
            border-radius: 10px;
            background: #f0f0f0;
        }

        .score-item.player {
            background: #e3f2fd;
            color: #1976d2;
        }

        .score-item.ai {
            background: #fff3e0;
            color: #f57c00;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>五子棋</h1>
        
        <div class="difficulty">
            <label for="difficulty">难度选择：</label>
            <select id="difficulty">
                <option value="1">简单</option>
                <option value="2" selected>中等</option>
                <option value="3">困难</option>
            </select>
        </div>

        <div class="score">
            <div class="score-item player">玩家: <span id="playerScore">0</span></div>
            <div class="score-item ai">AI: <span id="aiScore">0</span></div>
        </div>

        <div id="status" class="status player-turn">轮到你了，请下棋</div>
        
        <div class="board-container">
            <canvas id="board" width="570" height="570"></canvas>
        </div>

        <div class="controls">
            <button class="btn-restart" onclick="restartGame()">重新开始</button>
            <button class="btn-undo" onclick="undoMove()">悔棋</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const difficultySelect = document.getElementById('difficulty');

        const BOARD_SIZE = 15;
        const CELL_SIZE = 38;
        const PADDING = 19;
        const PIECE_RADIUS = 16;

        let board = [];
        let gameOver = false;
        let isPlayerTurn = true;
        let moveHistory = [];
        let playerScore = 0;
        let aiScore = 0;

        // 初始化棋盘
        function initBoard() {
            board = [];
            for (let i = 0; i < BOARD_SIZE; i++) {
                board[i] = [];
                for (let j = 0; j < BOARD_SIZE; j++) {
                    board[i][j] = 0;
                }
            }
            gameOver = false;
            isPlayerTurn = true;
            moveHistory = [];
            updateStatus('轮到你了，请下棋', 'player-turn');
            drawBoard();
        }

        // 绘制棋盘
        function drawBoard() {
            // 绘制背景
            ctx.fillStyle = '#f4d03f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格线
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 1;

            for (let i = 0; i < BOARD_SIZE; i++) {
                // 横线
                ctx.beginPath();
                ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
                ctx.lineTo(PADDING + (BOARD_SIZE - 1) * CELL_SIZE, PADDING + i * CELL_SIZE);
                ctx.stroke();

                // 竖线
                ctx.beginPath();
                ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
                ctx.lineTo(PADDING + i * CELL_SIZE, PADDING + (BOARD_SIZE - 1) * CELL_SIZE);
                ctx.stroke();
            }

            // 绘制星位
            const starPoints = [
                [3, 3], [3, 11], [11, 3], [11, 11], [7, 7],
                [3, 7], [7, 3], [7, 11], [11, 7]
            ];
            ctx.fillStyle = '#8b4513';
            starPoints.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 绘制棋子
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] !== 0) {
                        drawPiece(i, j, board[i][j]);
                    }
                }
            }

            // 标记最后一步
            if (moveHistory.length > 0) {
                const lastMove = moveHistory[moveHistory.length - 1];
                ctx.strokeStyle = lastMove.player === 1 ? '#ffffff' : '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(
                    PADDING + lastMove.x * CELL_SIZE,
                    PADDING + lastMove.y * CELL_SIZE,
                    PIECE_RADIUS - 5,
                    0,
                    Math.PI * 2
                );
                ctx.stroke();
            }
        }

        // 绘制棋子
        function drawPiece(x, y, player) {
            const cx = PADDING + x * CELL_SIZE;
            const cy = PADDING + y * CELL_SIZE;

            ctx.beginPath();
            ctx.arc(cx, cy, PIECE_RADIUS, 0, Math.PI * 2);

            if (player === 1) {
                // 黑棋（玩家）
                const gradient = ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, PIECE_RADIUS);
                gradient.addColorStop(0, '#666666');
                gradient.addColorStop(1, '#000000');
                ctx.fillStyle = gradient;
            } else {
                // 白棋（AI）
                const gradient = ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, PIECE_RADIUS);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, '#cccccc');
                ctx.fillStyle = gradient;
            }

            ctx.fill();
            ctx.strokeStyle = player === 1 ? '#000000' : '#999999';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // 更新状态显示
        function updateStatus(text, className) {
            statusDiv.textContent = text;
            statusDiv.className = 'status ' + className;
        }

        // 更新分数
        function updateScore() {
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('aiScore').textContent = aiScore;
        }

        // 点击事件
        canvas.addEventListener('click', function(e) {
            if (gameOver || !isPlayerTurn) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.round((e.clientX - rect.left - PADDING) / CELL_SIZE);
            const y = Math.round((e.clientY - rect.top - PADDING) / CELL_SIZE);

            if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE && board[x][y] === 0) {
                makeMove(x, y, 1);
                
                if (!gameOver) {
                    isPlayerTurn = false;
                    updateStatus('AI思考中...', 'ai-turn');
                    setTimeout(aiMove, 500);
                }
            }
        });

        // 下棋
        function makeMove(x, y, player) {
            board[x][y] = player;
            moveHistory.push({x, y, player});
            drawBoard();

            if (checkWin(x, y, player)) {
                gameOver = true;
                if (player === 1) {
                    playerScore++;
                    updateStatus('恭喜你赢了！', 'win');
                } else {
                    aiScore++;
                    updateStatus('AI赢了！', 'lose');
                }
                updateScore();
            } else if (isBoardFull()) {
                gameOver = true;
                updateStatus('平局！', '');
            }
        }

        // AI下棋
        function aiMove() {
            if (gameOver) return;

            const difficulty = parseInt(difficultySelect.value);
            const move = getBestMove(difficulty);
            
            if (move) {
                makeMove(move.x, move.y, 2);
                if (!gameOver) {
                    isPlayerTurn = true;
                    updateStatus('轮到你了，请下棋', 'player-turn');
                }
            }
        }

        // 获取最佳移动
        function getBestMove(difficulty) {
            const moves = [];
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0 && hasNeighbor(i, j)) {
                        const score = evaluatePosition(i, j, difficulty);
                        moves.push({x: i, y: j, score});
                    }
                }
            }

            if (moves.length === 0) {
                return {x: 7, y: 7};
            }

            moves.sort((a, b) => b.score - a.score);
            
            // 根据难度选择
            if (difficulty === 1) {
                // 简单：随机从前5个选择
                const topMoves = moves.slice(0, Math.min(5, moves.length));
                return topMoves[Math.floor(Math.random() * topMoves.length)];
            } else if (difficulty === 2) {
                // 中等：随机从前3个选择
                const topMoves = moves.slice(0, Math.min(3, moves.length));
                return topMoves[Math.floor(Math.random() * topMoves.length)];
            } else {
                // 困难：选择最佳
                return moves[0];
            }
        }

        // 检查是否有邻居
        function hasNeighbor(x, y) {
            for (let i = -2; i <= 2; i++) {
                for (let j = -2; j <= 2; j++) {
                    if (i === 0 && j === 0) continue;
                    const nx = x + i;
                    const ny = y + j;
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                        if (board[nx][ny] !== 0) return true;
                    }
                }
            }
            return false;
        }

        // 评估位置分数
        function evaluatePosition(x, y, difficulty) {
            let score = 0;
            
            // AI进攻分数
            board[x][y] = 2;
            score += evaluatePoint(x, y, 2) * (difficulty === 3 ? 1.1 : 1);
            board[x][y] = 0;

            // 防守分数（阻止玩家）
            board[x][y] = 1;
            score += evaluatePoint(x, y, 1) * (difficulty === 3 ? 1.0 : 0.9);
            board[x][y] = 0;

            // 中心位置加分
            const centerDist = Math.abs(x - 7) + Math.abs(y - 7);
            score += (14 - centerDist) * 0.1;

            return score;
        }

        // 评估某点的棋型分数
        function evaluatePoint(x, y, player) {
            let totalScore = 0;
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];

            for (const [dx, dy] of directions) {
                const line = getLine(x, y, dx, dy, player);
                totalScore += evaluateLine(line, player);
            }

            return totalScore;
        }

        // 获取一条线上的棋型
        function getLine(x, y, dx, dy, player) {
            let line = [];
            
            // 向一个方向延伸
            for (let i = -4; i <= 4; i++) {
                const nx = x + dx * i;
                const ny = y + dy * i;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    line.push(board[nx][ny]);
                } else {
                    line.push(-1); // 边界
                }
            }

            return line;
        }

        // 评估棋型
        function evaluateLine(line, player) {
            const opponent = player === 1 ? 2 : 1;
            let score = 0;

            // 连五
            if (containsPattern(line, [player, player, player, player, player])) {
                return 100000;
            }

            // 活四
            if (containsPattern(line, [0, player, player, player, player, 0])) {
                score += 10000;
            }

            // 冲四
            if (containsPattern(line, [opponent, player, player, player, player, 0]) ||
                containsPattern(line, [0, player, player, player, player, opponent]) ||
                containsPattern(line, [-1, player, player, player, player, 0]) ||
                containsPattern(line, [0, player, player, player, player, -1])) {
                score += 1000;
            }

            // 活三
            if (containsPattern(line, [0, player, player, player, 0])) {
                score += 1000;
            }

            // 眠三
            if (containsPattern(line, [opponent, player, player, player, 0, 0]) ||
                containsPattern(line, [0, 0, player, player, player, opponent]) ||
                containsPattern(line, [0, player, player, 0, player, 0]) ||
                containsPattern(line, [0, player, 0, player, player, 0])) {
                score += 100;
            }

            // 活二
            if (containsPattern(line, [0, player, player, 0])) {
                score += 50;
            }

            // 眠二
            if (containsPattern(line, [opponent, player, player, 0, 0]) ||
                containsPattern(line, [0, 0, player, player, opponent])) {
                score += 10;
            }

            return score;
        }

        // 检查是否包含某种棋型
        function containsPattern(line, pattern) {
            for (let i = 0; i <= line.length - pattern.length; i++) {
                let match = true;
                for (let j = 0; j < pattern.length; j++) {
                    if (line[i + j] !== pattern[j]) {
                        match = false;
                        break;
                    }
                }
                if (match) return true;
            }
            return false;
        }

        // 检查胜利
        function checkWin(x, y, player) {
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];

            for (const [dx, dy] of directions) {
                let count = 1;

                // 正方向
                for (let i = 1; i < 5; i++) {
                    const nx = x + dx * i;
                    const ny = y + dy * i;
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === player) {
                        count++;
                    } else {
                        break;
                    }
                }

                // 反方向
                for (let i = 1; i < 5; i++) {
                    const nx = x - dx * i;
                    const ny = y - dy * i;
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === player) {
                        count++;
                    } else {
                        break;
                    }
                }

                if (count >= 5) return true;
            }

            return false;
        }

        // 检查棋盘是否已满
        function isBoardFull() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0) return false;
                }
            }
            return true;
        }

        // 重新开始
        function restartGame() {
            initBoard();
        }

        // 悔棋
        function undoMove() {
            if (gameOver || moveHistory.length < 2) return;

            // 撤销AI的一步和玩家的一步
            for (let i = 0; i < 2; i++) {
                const lastMove = moveHistory.pop();
                if (lastMove) {
                    board[lastMove.x][lastMove.y] = 0;
                }
            }

            drawBoard();
            isPlayerTurn = true;
            updateStatus('轮到你了，请下棋', 'player-turn');
        }

        // 初始化游戏
        initBoard();
    </script>
</body>
</html>
